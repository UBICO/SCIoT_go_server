[project]
name = "sciot-worker"
description = "TFLite partition worker for the SCIoT Go server (gRPC)"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "tensorflow==2.20.0",
    "grpcio>=1.84",
    "protobuf>=6.31",
    "numpy>=1.26",
]

[project.scripts]
sciot-worker = "sciot_worker.__main__:main"
sciot-model = "sciot_worker.build.cli:main"

[dependency-groups]
dev = ["pytest>=8", "grpcio-tools>=1.84"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sciot_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["sciot_worker/v1"]  # generated by grpc_tools.protoc
