name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      # uv installs Python and the locked dependencies (worker/uv.lock).
      # The cache keeps TensorFlow (~500 MB) between runs; it is rebuilt only
      # when the lockfile changes.
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: ruff
        run: |
          uvx ruff check .
          uvx ruff format --check sciot_worker tests

      - name: pytest
        run: uv run pytest -v
