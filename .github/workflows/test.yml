name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      # uv installs Python and the locked dependencies (worker/uv.lock).
      # The cache keeps TensorFlow (~500 MB) between runs; it is rebuilt only
      # when the lockfile changes.
      # setup-uv publishes only full version tags from v8 on (no floating "v10").
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: ruff
        run: |
          uvx ruff@0.17.1 check .
          uvx ruff@0.17.1 format --check sciot_worker tests

      - name: pytest
        run: uv run pytest -v

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      # The oldest Python the client supports: the Raspberry Pi may have it.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: client/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: ruff
        run: |
          uvx ruff@0.17.1 check .
          uvx ruff@0.17.1 format --check sciot_client tests scripts

      - name: pytest
        run: uv run pytest -v

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      # Node from dashboard/.nvmrc (26, LTS); the npm cache is keyed on the
      # lockfile.
      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: vitest
        run: npm test

      # tsc -b, then vite build into internal/dashboard/dist.
      - name: build
        run: npm run build

      # The build must leave git clean: its output is ignored, and the
      # placeholder go:embed needs comes back identical from public/.
      - name: build leaves git clean
        run: |
          changed=$(git status --porcelain -- ../internal/dashboard)
          if [ -n "$changed" ]; then
            echo "The dashboard build changed tracked files:"
            echo "$changed"
            exit 1
          fi
